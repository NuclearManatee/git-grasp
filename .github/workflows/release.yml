name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Binary slugs (comma-separated). Empty = RELEASE_PLATFORMS secret or all four.'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile
        env:
          GIT_GRASP_SKIP_POSTINSTALL: '1'

      - name: Typecheck
        run: bun run typecheck
        env:
          GIT_GRASP_SKIP_POSTINSTALL: '1'

      - name: Unit + integration tests
        run: bun run test
        env:
          GIT_GRASP_MOCK_EMBEDDINGS: '1'
          GIT_GRASP_SKIP_POSTINSTALL: '1'

      - name: CI audit
        run: bun common/scripts/ci-audit.ts

      - name: Regression eval
        env:
          GIT_GRASP_SKIP_POSTINSTALL: '1'
          # Real embeddings required — mock KNN cannot meet the 0.95 regression gate.
          GIT_GRASP_MOCK_EMBEDDINGS: '0'
        run: bun run eval:regression

      - name: Export web pack
        run: bun run web:pack
        env:
          GIT_GRASP_MOCK_EMBEDDINGS: '0'

      - name: Build web
        run: bun run web:build
        env:
          PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: bunx playwright install chromium --with-deps

      - name: Web e2e
        working-directory: apps/web
        run: bun run e2e
        env:
          CI: '1'

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 2

  pages:
    needs: [gate]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release-matrix:
    needs: [gate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.plan.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve binary platforms
        id: plan
        env:
          RELEASE_PLATFORMS: ${{ secrets.RELEASE_PLATFORMS }}
          DISPATCH_PLATFORMS: ${{ github.event.inputs.platforms }}
        run: bash .github/scripts/release-platforms.sh

  binaries:
    needs: [gate, release-matrix]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.release-matrix.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile
        env:
          GIT_GRASP_SKIP_POSTINSTALL: '1'

      - name: Install SQLite (macOS — extension-capable lib for sqlite-vec)
        if: runner.os == 'macOS'
        run: brew install sqlite

      - name: Build release zip
        run: bun run build:release -- --platform=${{ matrix.slug }}
        env:
          GIT_GRASP_SKIP_POSTINSTALL: '1'

      - name: Smoke unzip + doctor (unix)
        if: runner.os != 'Windows'
        env:
          GIT_GRASP_MOCK_EMBEDDINGS: '1'
        run: |
          set -euo pipefail
          SMOKE="dist-release/smoke-${{ matrix.slug }}"
          rm -rf "$SMOKE"
          mkdir -p "$SMOKE"
          unzip -q "dist-release/git-grasp-${{ matrix.slug }}.zip" -d "$SMOKE"
          BIN="$SMOKE/git-grasp"
          chmod +x "$BIN"
          (cd "$SMOKE" && ./git-grasp doctor)

      - name: Smoke unzip + doctor (windows)
        if: runner.os == 'Windows'
        env:
          GIT_GRASP_MOCK_EMBEDDINGS: '1'
        shell: pwsh
        run: |
          $smoke = "dist-release/smoke-${{ matrix.slug }}"
          if (Test-Path $smoke) { Remove-Item -Recurse -Force $smoke }
          New-Item -ItemType Directory -Path $smoke | Out-Null
          Expand-Archive -Path "dist-release/git-grasp-${{ matrix.slug }}.zip" -DestinationPath $smoke -Force
          Push-Location $smoke
          try {
            & .\git-grasp.exe doctor
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.slug }}
          path: dist-release/git-grasp-${{ matrix.slug }}.zip
          if-no-files-found: error

  github-release:
    needs: [gate, binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: release-assets

      - name: Attach SHA256SUMS
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES="git-grasp $TAG — CLI binaries.

          Unzip, keep \`common/\` beside the binary, then run \`./git-grasp\` (Windows: \`git-grasp.exe\`) from the extracted folder. Optional: set \`GIT_GRASP_ROOT\` to that folder. Bun users: \`bun add -g git-grasp\`."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/*.zip release-assets/SHA256SUMS --clobber
          else
            gh release create "$TAG" release-assets/*.zip release-assets/SHA256SUMS \
              --title "$TAG" \
              --notes "$NOTES" \
              --verify-tag
          fi

  npm-publish:
    needs: [gate, binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install
        run: bun install --frozen-lockfile
        env:
          GIT_GRASP_SKIP_POSTINSTALL: '1'

      - name: Check version matches tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(bun -e "console.log(JSON.parse(await Bun.file('package.json').text()).version)")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Publish to npm (trusted publisher / OIDC)
        run: |
          set -euo pipefail
          node --version
          npm --version
          # setup-node registry-url injects an empty _authToken line and blocks OIDC — set registry only.
          printf '%s\n' 'registry=https://registry.npmjs.org/' > .npmrc
          npm publish --access public
