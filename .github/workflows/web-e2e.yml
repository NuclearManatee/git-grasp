name: Web e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile
        env:
          GIT_GRASP_SKIP_POSTINSTALL: '1'

      - name: Export web pack
        run: bun scripts/export-web-pack.ts
        env:
          GIT_GRASP_MOCK_EMBEDDINGS: '0'

      - name: Build web
        run: bun run web:build

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: bunx playwright install chromium --with-deps

      - name: Run e2e
        working-directory: apps/web
        run: bun run e2e
        env:
          CI: '1'
