name: Web e2e

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'common/src/search/**'
      - 'common/src/cli-api.ts'
      - 'common/src/db/**'
      - 'common/src/ux/**'
      - 'common/config/thresholds.json'
      - 'common/data/git-commands.db'
      - 'common/data/git-commands.db.sha256'
      - 'common/data/catalog/recipes.latest.json'
      - '.github/workflows/web-e2e.yml'
  push:
    branches: [develop, main]
    paths:
      - 'apps/web/**'
      - 'common/src/search/**'
      - 'common/src/cli-api.ts'
      - 'common/src/db/**'
      - 'common/src/ux/**'
      - 'common/config/thresholds.json'
      - 'common/data/git-commands.db'
      - 'common/data/git-commands.db.sha256'
      - 'common/data/catalog/recipes.latest.json'
      - '.github/workflows/web-e2e.yml'
  workflow_dispatch:

concurrency:
  group: web-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install
        run: bun install --frozen-lockfile
        env:
          GIT_GRASP_SKIP_POSTINSTALL: '1'

      - name: Export web pack
        run: bun run web:pack
        env:
          GIT_GRASP_MOCK_EMBEDDINGS: '0'

      - name: Build web
        run: bun run web:build

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: bunx playwright install chromium --with-deps

      - name: Run e2e
        working-directory: apps/web
        run: bun run e2e
        env:
          CI: '1'
