name: Regression Eval

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
        env:
          GIT_GRASP_SKIP_POSTINSTALL: '1'
      - run: bun run test
        env:
          GIT_GRASP_MOCK_EMBEDDINGS: '1'
          GIT_GRASP_SKIP_POSTINSTALL: '1'
      - name: Regression eval
        env:
          GIT_GRASP_SKIP_POSTINSTALL: '1'
          # Real embeddings required — mock KNN cannot meet the 0.95 regression gate.
          GIT_GRASP_MOCK_EMBEDDINGS: '0'
        run: bun run eval:regression
