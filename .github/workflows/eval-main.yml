name: Golden Eval

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
        env:
          GIT_HELP_SKIP_POSTINSTALL: '1'
      - run: bun run test
        env:
          GIT_HELP_MOCK_EMBEDDINGS: '1'
          GIT_HELP_SKIP_POSTINSTALL: '1'
      - name: Require DeepSeek secret
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY secret is required for the main gate" >&2
            exit 1
          fi
      - name: Golden eval
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GIT_HELP_SKIP_POSTINSTALL: '1'
          GIT_HELP_MOCK_EMBEDDINGS: '1'
        run: bun scripts/eval.js --min-pass-rate=0.9
