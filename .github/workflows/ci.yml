name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
        env:
          GIT_HELP_SKIP_POSTINSTALL: '1'
      - run: bun run test
        env:
          GIT_HELP_MOCK_EMBEDDINGS: '1'
          GIT_HELP_SKIP_POSTINSTALL: '1'
      - run: bun scripts/ci-audit.js
