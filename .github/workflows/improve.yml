name: Improve Loop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
        env:
          GIT_GRASP_SKIP_POSTINSTALL: '1'
      - name: Ensure improve branch
        run: |
          git config user.name "git-grasp-improve"
          git config user.email "improve@users.noreply.github.com"
          BR="improve/ci-$(date +%Y%m%d)"
          git checkout -B "$BR"
      - run: bun run eval:loop
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GIT_GRASP_MOCK_EMBEDDINGS: '1'
          GIT_GRASP_MOCK_JUDGE: '1'
