# Local Umami for Playwright e2e (not for production).
# Usage: docker compose -f apps/web/docker-compose.umami.yml up -d
services:
  umami-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U umami -d umami']
      interval: 5s
      timeout: 5s
      retries: 10

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    ports:
      - '3001:3000'
    environment:
      DATABASE_URL: postgresql://umami:umami@umami-db:5432/umami
      APP_SECRET: git-help-e2e-secret-change-me
      DISABLE_TELEMETRY: '1'
    depends_on:
      umami-db:
        condition: service_healthy

volumes:
  umami-db-data:
